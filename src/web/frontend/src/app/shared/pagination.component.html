    @if (totalItems() > 0 && totalPages() > 1) {
      <nav class="pagination" [attr.aria-label]="label()">
        <span class="pagination-summary">{{ rangeStart() }}–{{ rangeEnd() }} sur {{ totalItems() }}</span>
        <div class="pagination-controls">
          <button class="btn btn--secondary btn--small" type="button" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">Précédent</button>
          <span class="pagination-indicator" aria-live="polite">Page {{ page() }} / {{ totalPages() }}</span>
          <button class="btn btn--secondary btn--small" type="button" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">Suivant</button>
        </div>
      </nav>
    }
