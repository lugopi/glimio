name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web,dev]'

      - name: Check version consistency
        run: python scripts/build_release.py --check-version

      - name: Run Python tests
        run: python -m pytest -q src/tests

  frontend:
    name: Angular checks and production build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build Angular production bundle
        run: npm run build
