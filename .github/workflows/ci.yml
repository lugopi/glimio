name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Tests Python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer le projet et les dépendances de test
        run: python -m pip install -e ".[web,dev]"
      - name: Exécuter la suite Python
        run: python -m pytest -q src/tests

  frontend-tests:
    name: Vérifications Angular
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/web/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json
      - name: Installer les dépendances Angular verrouillées
        run: npm ci
      - name: Vérifier les types Angular
        run: npm run typecheck
      - name: Tests Angular
        run: npm test

  frontend-build:
    name: Build Angular de production
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/web/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json
      - name: Installer les dépendances Angular verrouillées
        run: npm ci
      - name: Compiler Angular en production
        run: npm run build
