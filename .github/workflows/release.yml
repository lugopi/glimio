name: Build and release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  python-tests:
    name: Validate release and run Python tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag and project versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          python scripts/build_release.py --check-version --version "$version"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web,dev]'

      - name: Run Python tests
        run: python -m pytest -q src/tests

  frontend:
    name: Validate and build Angular
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build Angular production bundle
        run: npm run build

      - name: Upload Angular bundle
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/glimio-web-ui/**
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.edition }} on ${{ matrix.platform }}
    needs: [python-tests, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            edition: cli
          - os: windows-latest
            platform: windows
            edition: web
          - os: ubuntu-22.04
            platform: linux
            edition: cli
          - os: ubuntu-22.04
            platform: linux
            edition: web
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.edition }}" == "web" ]]; then
            python -m pip install -e '.[web,bundle]'
          else
            python -m pip install -e '.[cli,bundle]'
          fi

      - name: Download Angular bundle
        if: matrix.edition == 'web'
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/glimio-web-ui

      - name: Build portable package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          python scripts/build_release.py --platform windows --edition '${{ matrix.edition }}' --version $version

      - name: Build portable package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/build_release.py --platform linux --edition '${{ matrix.edition }}' --version "$version"

      - name: Compile Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $payload = (Resolve-Path "dist/release/${{ matrix.edition }}/payload").Path
          & $compiler "/DAppVersion=$version" "/DEdition=${{ matrix.edition }}" "/DPayloadDir=$payload" 'scripts/package/installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.edition }}
          path: dist/release/${{ matrix.edition }}/Glimio-*
          if-no-files-found: error
          retention-days: 3

  publish-draft:
    name: Publish draft release with checksums
    runs-on: ubuntu-22.04
    needs: [package]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os
          import re

          def file_sha256(path):
              digest = sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          version = os.environ["GITHUB_REF_NAME"][1:]
          release_dir = Path("dist/release")
          assets = sorted(path for path in release_dir.iterdir() if path.is_file() and path.name.startswith("Glimio-"))
          if len(assets) != 6:
              raise SystemExit(f"Expected 6 release assets (2 Windows installers, 2 Windows portable archives, 2 Linux archives), found {len(assets)}: {[p.name for p in assets]}")
          names = [path.name for path in assets]
          required_suffixes = {
              "-Windows-x64-Setup.exe": 2,
              "-Windows-x64-portable.zip": 2,
              "-Linux-x86_64.tar.gz": 2,
          }
          for suffix, expected_count in required_suffixes.items():
              actual_count = sum(name.endswith(suffix) for name in names)
              if actual_count != expected_count:
                  raise SystemExit(f"Expected {expected_count} assets ending in {suffix}, found {actual_count}: {names}")
          (release_dir / "SHA256SUMS.txt").write_text(
              "".join(f"{file_sha256(path)}  {path.name}\n" for path in assets),
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"(?m)^##\s+{re.escape(version)}(?:\s|—).*\n", changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          start = match.end()
          following = re.search(r"(?m)^##\s+", changelog[start:])
          body = changelog[start:start + following.start()] if following else changelog[start:]
          body = body.strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print("Release assets:")
          print("\n".join(f"- {name}" for name in names))
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --draft \
            --title "Glimio $version" \
            --notes-file release-notes.md
