[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glimio-notes"
version = "0.5.0"
description = "Glimio — local audio recording and import, speech transcription, speaker diarization, AI summaries, and searchable session notes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundcard>=0.4.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
# The core distribution is the CLI. The Web stack is installed only with the web extra.
cli = []
diarization = ["sherpa-onnx>=1.10.28"]
# Optional source separation / voice-identity backend. Install a PyTorch build
# compatible with the target CPU/CUDA platform before adding this extra.
separation = ["speechbrain>=1.0.0"]
web = [
    "fastapi>=0.143.4",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
bundle = [
    "pyinstaller>=6.0",
]

[project.scripts]
# Glimio commands; legacy aliases are retained for existing scripts.
glimio = "seance.cli:main"
glimio-web = "web.app:main"
seance = "seance.cli:main"
seance-web = "web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["seance*", "web*"]

[tool.setuptools.package-data]
# The Angular frontend is the only Web UI. The former hand-written static JS/CSS
# application was removed; package only the current frontend source/configuration.
web = ["frontend/**/*"]

[tool.coverage.run]
source = ["src/seance", "src/web"]
omit = ["src/tests/*"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
