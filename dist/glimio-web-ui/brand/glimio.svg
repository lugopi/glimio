<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glimio">
  <!--
    Glimio brand mark. Every paintable element is theme-driven:
    - --brand-primary : main background shape
    - --brand-secondary : accent details (ring, waveform bars, spark)
    Set these variables per theme so the logo stays visible in light and dark UIs.
  -->
  <style>
    .bg { fill: var(--brand-primary, #8ab4f8); }
    .ring { fill: none; stroke: var(--brand-secondary, #101821); stroke-width: 4; }
    .bar { fill: var(--brand-secondary, #101821); }
    .spark { fill: none; stroke: var(--brand-secondary, #101821); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="16"/>
  <circle class="ring" cx="32" cy="32" r="17"/>
  <g class="bar">
    <rect x="20" y="29" width="4" height="6" rx="2"/>
    <rect x="27" y="24" width="4" height="16" rx="2"/>
    <rect x="34" y="20" width="4" height="24" rx="2"/>
    <rect x="41" y="27" width="4" height="10" rx="2"/>
  </g>
  <path class="spark" d="M14 50c6-4 10-4 16 0s10 4 16 0" opacity="0.9"/>
</svg>
